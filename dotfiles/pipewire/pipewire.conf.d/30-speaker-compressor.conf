# Built-in speaker only: louder perceived level without clipping (docs/hardware.md, "Speaker loudness").
# The speakers distort with any gain above 0 dB, so this evens out the level instead: a high-pass
# drops bass the speakers can't play (it only eats headroom), a compressor (swh-plugins sc4) lifts
# quiet passages and a look-ahead limiter keeps the peaks under full scale.
# Tuned by ear 2026-10-11 (live: pw-cli s speaker_compressor Props '{ params = [ "comp:Ratio (1:n)" 3.0 ] }'):
# +12 dB makeup and a 150 Hz cut made DevilutionX (bass-heavy, hissy samples) distort and hiss; this is
# gentler. At full volume loud treble still distorts a little: the speakers' limit, so keep volume below max.
# A WirePlumber smart filter bound to the speaker sink: streams to that sink pass through it, the
# headphones (a separate sink, HiFi__Headphones__sink) and any Bluetooth sink are untouched. The
# volume keys still act on the speaker sink itself, i.e. after the compressor, so the volume doesn't
# change how hard it compresses. Needs swh-plugins. Off: delete this file, restart pipewire.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Speaker compressor"
            media.name       = "Speaker compressor"
            filter.graph = {
                nodes = [
                    { type = builtin name = hpL label = bq_highpass control = { "Freq" = 250.0 "Q" = 0.707 } }
                    { type = builtin name = hpR label = bq_highpass control = { "Freq" = 250.0 "Q" = 0.707 } }
                    {   type = ladspa name = comp plugin = sc4_1882 label = sc4
                        control = {
                            "RMS/peak" = 1.0
                            "Attack time (ms)" = 20.0
                            "Release time (ms)" = 300.0
                            "Threshold level (dB)" = -20.0
                            "Ratio (1:n)" = 3.0
                            "Knee radius (dB)" = 6.0
                            "Makeup gain (dB)" = 6.0
                        }
                    }
                    {   type = ladspa name = lim plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
                        control = { "Input gain (dB)" = 0.0 "Limit (dB)" = -1.0 "Release time (s)" = 0.1 }
                    }
                ]
                links = [
                    { output = "hpL:Out" input = "comp:Left input" }
                    { output = "hpR:Out" input = "comp:Right input" }
                    { output = "comp:Left output" input = "lim:Input 1" }
                    { output = "comp:Right output" input = "lim:Input 2" }
                ]
                inputs  = [ "hpL:In" "hpR:In" ]
                outputs = [ "lim:Output 1" "lim:Output 2" ]
            }
            capture.props = {
                node.name      = "speaker_compressor"
                media.class    = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                filter.smart = true
                filter.smart.name = "speaker-compressor"
                filter.smart.target = { node.name = "alsa_output.platform-cht-bsw-rt5645.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name      = "speaker_compressor.out"
                node.passive   = true
                audio.channels = 2
                audio.position = [ FL FR ]
                stream.dont-remix = true
            }
        }
    }
]
