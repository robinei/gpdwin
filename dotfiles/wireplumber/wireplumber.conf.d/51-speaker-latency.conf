# The Cherry Trail SST speaker device came up with 34 x 1008-frame periods (~714 ms hardware
# buffer). Cap it at 4 x 1024 frames (~85 ms) to keep audio latency down.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*cht-bsw-rt5645.*" } ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.period-num = 4
        api.alsa.headroom = 0
      }
    }
  }
]
