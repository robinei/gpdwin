# GPD: small HUD for checking game performance: FPS, CPU and GPU clock (with load %), battery.
# Loaded into everything Pegasus starts (dotfiles/pegasus-frontend/run), hidden until
# Right Shift+F12 shows it (per game, starts hidden again next launch).
no_display
toggle_hud=Shift_R+F12
# Pegasus inherits the preload too; keep the HUD (and its frame hooks) out of it
blacklist=pegasus-fe,shelf
fps
frame_timing=0
cpu_stats
cpu_mhz
gpu_stats
gpu_core_clock
# battery %, and power draw in W while on battery (0 when charging). Needs our MangoHud patch
# aur/patches/mangohud-light/0002 (upstream only finds supplies named BAT*)
battery
battery_watt
# update the numbers once a second (less work than the default 500 ms)
fps_sampling_period=1000
position=top-left
font_size=20
background_alpha=0.4
