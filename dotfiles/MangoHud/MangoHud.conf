# GPD: small HUD for checking game performance: FPS, CPU and GPU clock (with load %), battery.
# Loaded into every game shelf starts (dotfiles/shelf/run), hidden until
# Ctrl+Shift+F12 shows it (per game, starts hidden again next launch). MangoHud only watches the
# keys, the game still gets them, so the chord must be one games don't use: RetroArch ignores
# modifiers, and Super+H was its Reset (H). sway leaves Ctrl+Shift+F12 unbound.
no_display
toggle_hud=Control_L+Shift_L+F12
# shelf doesn't get the preload; this is in case it ever inherits it
blacklist=shelf
fps
frame_timing=0
cpu_stats
cpu_mhz
# whole-package draw (CPU + GPU + memory controller, RAPL; also on AC), shown in the CPU row; needs
# energy_uj readable by wheel (/etc/tmpfiles.d/turbo.conf). battery_watt below is only the battery's own flow.
cpu_power
gpu_stats
gpu_core_clock
# battery %, and power draw in W while on battery (0 when charging). Needs our MangoHud patch
# aur/patches/mangohud-light/0002 (upstream only finds supplies named BAT*)
battery
battery_watt
# update the numbers once a second (less work than the default 500 ms)
fps_sampling_period=1000
position=top-left
# 4 columns: the CPU row is CPU | load | MHz | W (with 3 the watts wrapped onto a line of their own)
table_columns=4
font_size=20
background_alpha=0.4
