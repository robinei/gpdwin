# GPD: small HUD for checking game performance: FPS, CPU and GPU clock (with load %).
# Used only by games whose launcher runs `mangohud wine ...`. Right Shift+F12 hides/shows it.
fps
frame_timing=0
cpu_stats
cpu_mhz
gpu_stats
gpu_core_clock
# update the numbers once a second (less work than the default 500 ms)
fps_sampling_period=1000
position=top-left
font_size=20
background_alpha=0.4
toggle_hud=Shift_R+F12
