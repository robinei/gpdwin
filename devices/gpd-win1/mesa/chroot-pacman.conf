# pacman.conf for the GPD package build chroot (mesa/build.sh): devtools' extra.conf with official Arch
# mirrors written out and a cache of its own. The desktop runs CachyOS: its mirrorlist starts with a CachyOS
# mirror of Arch that lags behind (404s), and its package cache holds CachyOS builds under Arch package names.
[options]
HoldPkg     = pacman glibc
Architecture = x86_64
CacheDir    = /var/cache/gpd-archbuild/pkg/
NoProgressBar
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch
