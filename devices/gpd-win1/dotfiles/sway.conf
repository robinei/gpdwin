# GPD Win 1: sway settings for this device (linked to ~/.config/gpd/sway.d/10-device.conf).
# The panel is a portrait 720x1280 DSI panel mounted sideways.
output DSI-1 transform 90
# No subpixel antialiasing: grey antialiasing is sharp enough at this density, and glyph caches stay
# 8-bit instead of 32-bit (the kernel's native "rgb" would also be wrong for the rotated panel).
output DSI-1 subpixel none
# Composite 12 ms before vblank instead of right after it. Measured 2026-10-07 with the i915 frame
# counter: default drops 11-14% of refreshes in RetroArch and HLD, 12 ms drops 0-0.3% (10 ms: 3-6%,
# 14 ms: same as 12 but 2 ms more latency). Also ~4.6 ms less input latency. See docs/desktop.md.
output DSI-1 max_render_time 12

# Resync the panel when the picture is split (bottom half at top): Super+F10 (docs/hardware.md "Display")
bindsym --locked $mod+F10 exec ~/.config/sway/screen-reset.sh

# Speaker compressor tuning (scripts/speaker-tune): Super+C while a game plays. The keys go to this
# mode, so the game keeps focus (RetroArch pauses without it); the value window never takes focus.
for_window [app_id="speaker-tune"] floating enable, sticky enable, move position 16 16
no_focus [app_id="speaker-tune"]
set $tune ~/gpd/scripts/speaker-tune
bindsym $mod+c exec $tune start
mode "speaker-tune" {
    bindsym Up exec $tune key up
    bindsym Down exec $tune key down
    bindsym Left exec $tune key left
    bindsym Right exec $tune key right
    bindsym b exec $tune key bypass
    bindsym s exec $tune key save
    bindsym r exec $tune key revert
    bindsym --locked XF86AudioLowerVolume exec ~/.config/sway/osd.sh vol-down
    bindsym --locked XF86AudioRaiseVolume exec ~/.config/sway/osd.sh vol-up
    bindsym Escape exec $tune stop
    bindsym Return exec $tune stop
    bindsym $mod+c exec $tune stop
}
