# GPD Win 1 hardware facts, read by statusbar, inputd, shelf and game-wrap (src/devconf.h, scripts/game-wrap).
# Linked to ~/.config/gpd/device.conf. key=value, no spaces around "=", values with spaces in "quotes":
# shell scripts source this file.
# Every key is optional: a missing one means auto-detection or the program's default (docs/repo-layout.md).

# Power supplies (/sys/class/power_supply): the fuel gauge, and the charger whose "online" means the cable
# is in (the tcpm USB-PD supply also has "online", so name the charger)
battery=max170xx_battery
charger=bq24190-charger
# Wi-Fi interface
wifi=wlan0
# CPU temperature: the hwmon driver whose temp*_input are the cores
temp_hwmon=coretemp
# Package power limit: the firmware's own value (statusbar colours above/below it; game-wrap restores it)
# and the steps shelf's W key offers (docs/power.md "Package power limit"). The board has a fault
# (2026-10-13, docs/power.md): consider dropping 8 until it is repaired.
power_default_w=6.016
power_steps_w="8 1 2 4"
# The key that opens shelf (inputd): Linux input key code. 127 = KEY_COMPOSE, the Menu key bottom right.
menu_key=127
# The built-in gamepad's input name (inputd: activity, grab while the lid is closed)
pad_name="Microsoft X-Box 360 pad"
