# Autologin on tty1 (sway starts from fish's login, dotfiles/fish/conf.d/sway.fish).
# Type=simple: getty@ is Type=idle, which holds agetty back until every other boot job has finished
# (so a text prompt isn't mixed with boot messages). Nobody sees this prompt (silent boot,
# autologin straight into sway), and the wait cost ~1.3 s per boot (devices/gpd-win1/docs/boot.md).
[Service]
Type=simple
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --skip-login --noissue --nohostname --nonewline --autologin @USER@ %I $TERM
