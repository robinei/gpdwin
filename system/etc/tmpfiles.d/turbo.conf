# Let the wheel group toggle CPU/GPU turbo (used by ~/.config/sway/turbo.sh) and pin the GPU minimum
# clock and raise the package power limit for a game (rps_min_freq_mhz, RAPL PL1: Dark Souls' launcher,
# users/robin/docs/steam-library.md; the firmware's PL1 is 6 W and comes back at every boot)
z /sys/devices/system/cpu/intel_pstate/no_turbo        0664 root wheel -
z /sys/class/drm/card*/gt/gt0/rps_max_freq_mhz         0664 root wheel -
z /sys/class/drm/card*/gt/gt0/rps_boost_freq_mhz       0664 root wheel -
z /sys/class/drm/card*/gt/gt0/rps_min_freq_mhz         0664 root wheel -
z /sys/class/powercap/intel-rapl:0/constraint_0_power_limit_uw 0664 root wheel -
# Package energy counter readable by wheel (normally root only, because of the PLATYPUS power side channel;
# single-user device): MangoHud's cpu_power shows the package draw from it (dotfiles/MangoHud/MangoHud.conf)
z /sys/class/powercap/intel-rapl:0/energy_uj 0440 root wheel -
