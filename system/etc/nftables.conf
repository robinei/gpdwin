#!/usr/bin/nft -f
# GPD firewall: allow ssh from the local network, drop other incoming traffic. Outgoing is open.
destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state invalid drop
    ct state { established, related } accept
    iif lo accept
    meta l4proto ipv6-icmp accept                       # neighbour discovery, router adverts
    meta l4proto icmp accept
    udp sport 67 udp dport 68 accept                    # DHCPv4 replies
    udp sport 547 udp dport 546 accept                  # DHCPv6 replies
    tcp dport 22 ip saddr 192.168.1.0/24 accept
    tcp dport 22 ip6 saddr { fe80::/10, fd75:405:a0d5::/48 } accept
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}
