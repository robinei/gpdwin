# Bluetooth is not used: BlueZ isn't installed and the radio was soft-blocked anyway. Without this
# the kernel loads the stack and the BCM4356's UART driver at every boot (~1.6 MB, and it looks
# for chip firmware that isn't there). hci_uart pulls in the btbcm/btintel/btrtl/btqca helpers, so
# blocking it and the core is enough.
# To use Bluetooth: delete this file (and its manifest.tsv line), reboot, install bluez.
blacklist hci_uart
blacklist bluetooth
